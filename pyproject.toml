[tool.poetry]
name = "phone-agent"
version = "0.1.0"
description = "CrewAI Phone Research Agent - NixOS Edition"
authors = ["unknown <unknown@example.com>"]
packages = [{ include = "phone_agent", from = "src" }]

[tool.poetry.dependencies]
python = "^3.11"
crewai = ">=0.86,<1.0"
playwright = "==1.49.0"
pydantic = ">=2.9"
pandas = ">=2.2"
openpyxl = ">=3.1"
python-dotenv = ">=1.0"
pydantic-settings = ">=2.5"
tenacity = ">=9.0"
beautifulsoup4 = ">=4.12"
markdownify = ">=0.13"

[tool.poetry.group.dev.dependencies]
pytest = ">=8.3"
pytest-mock = ">=3.14"
ruff = ">=0.6"
mypy = ">=1.11"

[build-system]
requires = ["poetry-core"]
build-backend = "poetry.core.masonry.api"
